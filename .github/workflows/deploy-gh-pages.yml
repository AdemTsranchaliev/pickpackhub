# Publishes `dist/` to branch `gh-pages` (GitHub Pages: Deploy from branch → gh-pages / root).
name: Deploy GitHub Pages

on:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: gh-pages-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install and build
        env:
          # Root base: project site with custom domain (public/CNAME). Omit VITE_BASE_PATH → "/" in vite.config.
          VITE_PUBLIC_SITE_URL: https://pickpackhub.eu
        run: |
          npm ci
          npm run build
          ORIGIN="https://pickpackhub.eu"
          sed -i "s|https://pickpackhub.com|${ORIGIN}|g" dist/robots.txt dist/sitemap.xml

      - name: Deploy to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          force_orphan: true
